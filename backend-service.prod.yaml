# Cloud Run service manifest for bvo-api (backend) — production.
# `image: backend` below is a bare artifact-key placeholder, not a real
# path — Skaffold/Cloud Deploy matches it against the `--images=backend=...`
# key at release time and swaps in the actual pushed image URI. It must
# stay exactly "backend" (no registry prefix) or the substitution silently
# doesn't happen and Cloud Run tries to pull the literal placeholder text
# as an image reference (this bit us once — see trigger-setup.md).
# Points at the PROD Cloud SQL (PostgreSQL) instance and PROD Memorystore
# for Valkey instance, and prod (live) third-party keys.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bvo-backend-prod
  labels:
    app: bvo-backend
    env: prod
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        # Lowered from 20 because the ceiling is the DATABASE, not Cloud Run. Every instance
        # holds up to DB_POOL_MAX connections, and 20 x 5 = 100 would consume the whole Cloud SQL
        # max_connections on its own. At containerConcurrency 80 this still admits ~800
        # concurrent requests. Raise this ONLY together with DB_POOL_MAX and a confirmed
        # max_connections — see docs/AUTOSCALING_TASK.md for the budget.
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/vpc-access-connector: bvo-vpc-connector
        run.googleapis.com/vpc-access-egress: private-ranges-only
        # Cold starts on this image are CPU-bound; the boost shortens the window in which the
        # startup probe is waiting on a container that has not bound its port yet.
        run.googleapis.com/startup-cpu-boost: "true"
        # Always-allocated CPU. The backend runs two background timers — the outbox relay
        # (15s) and the database reconnect backoff in DatabaseBootstrap.ts — and with the
        # default request-scoped throttling both are starved between requests, which would
        # stall recovery from a database drop precisely when it matters. This is the one
        # setting here that increases the prod bill.
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      containers:
        - image: backend
          ports:
            - containerPort: 3000
          # Explicit startup probe. The Cloud Run default is a single TCP check with a 240s
          # deadline, which is how the 2026-09-01 outage presented: DEADLINE_EXCEEDED with no
          # indication of why. This polls the SHALLOW liveness endpoint every 5s for ~2 minutes.
          #
          # /api/v1/apiHealthCheck is unconditionally 200 once the process listens and does NOT
          # touch the database. Do not repoint this at /apiHealthCheck/ready — a probe wired to
          # database readiness rebuilds the exact crash loop this manifest change removes.
          #
          # There is deliberately no livenessProbe: once the port binds independently of the
          # database, a liveness probe only adds a new way to kill healthy containers.
          startupProbe:
            httpGet:
              path: /api/v1/apiHealthCheck
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          env:
            # PORT is deliberately not set here — Cloud Run reserves that
            # name and injects it automatically to match containerPort
            # above. Setting it manually causes deployment to fail.
            - name: NODE_ENV
              value: "production"
            - name: ENABLE_ACTOR_HIRED_EMAILS
              value: "true"
            - name: BETA_CREDIT_SIMULATION_ENABLED
              value: "false"
            # Master kill switch. Per-user approval and expiration are still
            # required before any production checkout can use BYPASS mode.
            - name: ENABLE_PRODUCTION_PAYMENT_BYPASS
              value: "true"
            # bootstrap.ts builds its CORS allowlist from CLIENT_URLS (falls
            # back to APP_URL, comma-separated). Note: bootstrap.ts also
            # skips the allowlist entirely (corsOptions = {}) when
            # SERVER_CONFIG.ENV === "PROD" (an exact-match check against a
            # separate ENV var, not NODE_ENV, which is not set anywhere in
            # this manifest) — so CORS stays locked to this explicit list
            # here rather than accidentally opening wide.
            - name: CLIENT_URLS
              value: "https://bvo-frontend-prod-d5ijitzpuq-uc.a.run.app,https://www.bionicvo.ai,https://bionicvo.ai"
            # Seeds durable production storage when the storage admin setting
            # does not exist yet. The persisted admin setting takes precedence.
            - name: GCP_BUCKET
              value: "bvo-assets-prod"
            # Canonical public origin used in password-reset and other
            # customer-facing email links. CLIENT_URLS is a CORS allowlist
            # and must not be used as a single URL.
            - name: CLIENT_APP_URL
              value: "https://bionicvo.ai"
            - name: DB_SSL
              value: "true"
            # Per-instance Postgres pool ceiling (PostgresqlConnection.ts). Without this,
            # node-postgres defaults to 10 per instance and nothing bounds total connections.
            # Budget against an assumed max_connections of 100. The only prod consumers are this
            # service and bvo-migrate-prod — the document/audition worker Jobs are staging-only
            # and hit the staging database:
            #   backend   10 instances x 5 = 50
            #   bvo-migrate-prod       x 2 =  2   (capped in scripts/run-migrations.ts)
            #                              ----
            #                                52, leaving headroom for the superuser reserve,
            #                                psql sessions and admin tooling.
            # Confirm the real ceiling with `SHOW max_connections;` and re-derive if it differs.
            - name: DB_POOL_MAX
              value: "5"
            # Production-only, admin-triggered actor conflict promotion. The
            # referenced staging credential has column-level SELECT access to
            # actor identity and usagePreferences only.
            - name: ACTOR_CONFLICT_PROMOTION_ENABLED
              value: "true"
            - name: STAGING_DB_SSL
              value: "true"
            # Actor promotion downloads media through staging's public media
            # endpoints, then writes provider-independent keys into production
            # storage before updating the production actor record.
            - name: STAGING_API_BASE_URL
              value: "https://bvo-backend-staging-d5ijitzpuq-uc.a.run.app"
            - name: STAGING_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bvo-actor-conflict-staging-url-prod
                  key: "latest"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: bvo-db-host-prod
                  key: "latest"
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: bvo-db-port-prod
                  key: "latest"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bvo-db-username-prod
                  key: "latest"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bvo-db-password-prod
                  key: "latest"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: bvo-db-name-prod
                  key: "latest"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: bvo-redis-url-prod
                  key: "latest"
            - name: ELEVEN_LABS_API_BASE_URL
              value: "https://api.elevenlabs.io"
            # Canonical application variable — elevenlabs.ts reads
            # ELEVEN_LABS_API_KEY (with underscores). Prod previously mapped this
            # secret to ELEVENLABS_API_KEY, which the app never read, so voice
            # generation had no key. Secret resource name is unchanged; only the
            # env-var mapping is corrected to match the app config.
            - name: ELEVEN_LABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bvo-elevenlabs-key-prod
                  key: "latest"
            # Required — JwtService signs/verifies all auth tokens with
            # SERVER_CONFIG.SECRET (process.env.SECRET). Missing this makes
            # every login fail with a 400 "secretOrPrivateKey must have a
            # value" error from the jsonwebtoken library, even though the
            # request itself is otherwise fine.
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: bvo-jwt-secret-prod
                  key: "latest"
            # Keep admin-setting encryption independent from JWT signing so
            # SMTP, Stripe, and other encrypted settings survive deployments and
            # future JWT secret rotations. Must be set BEFORE configuring any
            # admin_settings, or those settings encrypt under sha256(SECRET) and
            # won't decrypt once this key is added.
            - name: SETTINGS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: bvo-settings-encryption-key-prod
                  key: "latest"
            # Zendesk continues to use the existing DB-backed API token until
            # the production OAuth client and Secret Manager entry are provisioned.
            # STRIPE_SECRET_KEY intentionally not injected here — Stripe
            # key handling is managed inside the app itself, not via this
            # Cloud Run manifest/Secret Manager.
          resources:
            limits:
              cpu: "1"
              # Raised from 512Mi: bootstrap.ts sets a 50mb body-parser limit and
              # containerConcurrency is 80, so a burst of large uploads could OOM-kill the
              # container. An OOM kill during boot is indistinguishable in the logs from the
              # startup-probe failure this change is meant to eliminate.
              memory: 1Gi
