# Cloud Run service manifest for bvo-new (frontend) — pre-prod.
# `image: frontend` below is a bare artifact-key placeholder, not a real
# path — Skaffold/Cloud Deploy matches it against the `--images=frontend=...`
# key at release time and swaps in the actual pushed image URI. It must
# stay exactly "frontend" (no registry prefix) or the substitution silently
# doesn't happen and Cloud Run tries to pull the literal placeholder text
# as an image reference (this bit us once — see trigger-setup.md).
#
# API_BASE_URL is read at RUNTIME by server.js (via a /env-config.js route
# it serves), not baked in at build time. Points at the PRE-PROD backend so
# the pre-prod frontend talks to the pre-prod API (which runs against the
# staging DB). That backend's CLIENT_URLS must include this service's origin
# or CORS will reject the browser. See src/config/api.ts for how the frontend
# consumes this at runtime.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bvo-frontend-pre-prod
  labels:
    app: bvo-frontend
    env: pre-prod
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 100
      containers:
        - image: frontend
          ports:
            - containerPort: 8080
          env:
            - name: API_BASE_URL
              value: "https://bvo-backend-pre-prod-d5ijitzpuq-uc.a.run.app"
            # Gates analytics (GA4, Google Tag Manager and the Meta Pixel). The frontend only
            # loads tags when this reads exactly "prod" — see
            # bvo-new/src/lib/analytics/bootstrap.ts. pre-prod runs against the
            # staging database, so its traffic must never reach the prod GA4
            # property or the Meta Pixel.
            - name: APP_ENV
              value: "pre-prod"
            - name: PUBLIC_SITE_URL
              value: "https://bvo-frontend-pre-prod-516740748317.us-central1.run.app"
            # GA4 measurement ID. Empty on purpose: APP_ENV gates analytics to prod
            # only, so nothing here would load anyway — but keeping the variable
            # declared and blank makes the intent explicit and means a value pasted
            # into the wrong file cannot silently start reporting non-prod traffic
            # into the production property.
            - name: GA4_MEASUREMENT_ID
              value: ""
            # Dry-run is a staging-only QA aid; see frontend-service.staging.yaml.
            - name: ANALYTICS_DRY_RUN
              value: ""
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
