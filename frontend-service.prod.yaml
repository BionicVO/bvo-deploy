# Cloud Run service manifest for bvo-new (frontend) — production.
# `image: frontend` below is a bare artifact-key placeholder, not a real
# path — Skaffold/Cloud Deploy matches it against the `--images=frontend=...`
# key at release time and swaps in the actual pushed image URI. It must
# stay exactly "frontend" (no registry prefix) or the substitution silently
# doesn't happen and Cloud Run tries to pull the literal placeholder text
# as an image reference (this bit us once — see trigger-setup.md).
#
# API_BASE_URL is read at RUNTIME by server.js (via a /env-config.js route
# it serves), not baked in at build time — this lets the same built image
# get promoted from staging to prod without pointing at the wrong backend.
# See src/config/api.ts for how the frontend consumes this at runtime.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bvo-frontend-prod
  labels:
    app: bvo-frontend
    env: prod
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 100
      containers:
        - image: frontend
          ports:
            - containerPort: 8080
          env:
            - name: API_BASE_URL
              value: "https://bvo-backend-prod-d5ijitzpuq-uc.a.run.app"
            # Gates analytics (GA4, Google Tag Manager and the Meta Pixel). This is the
            # ONLY environment where the frontend loads tags — the check is an exact
            # match on "prod" (see bvo-new/src/lib/analytics/bootstrap.ts), and it
            # fails closed, so a typo here means prod goes untracked rather than
            # staging polluting the GA4 property.
            - name: APP_ENV
              value: "prod"
            - name: PUBLIC_SITE_URL
              value: "https://bionicvo.ai"
            # GA4 measurement ID for the production property.
            #
            # TODO: set this to the real "G-…" once the GA4 property and web data
            # stream exist. It is intentionally EMPTY until then: GA4 stays off rather
            # than reporting to a property that does not exist. The client also drops
            # anything not matching /^G-[A-Z0-9]{4,}$/, so a malformed value disables
            # GA4 rather than being interpolated into a script URL.
            #
            # Injected here rather than baked into the bundle so the same promoted
            # image can report per environment. Not a secret — a measurement ID is
            # public by design, visible in any page's network tab.
            - name: GA4_MEASUREMENT_ID
              value: ""
            # Dry-run is a staging-only QA aid; see frontend-service.staging.yaml.
            - name: ANALYTICS_DRY_RUN
              value: ""
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
