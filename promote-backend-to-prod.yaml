# Promotes an already-staged BACKEND release to prod. Run manually (or
# trigger on a version tag push, e.g. "v*") once staging has been verified.
#
# Separate from promote-frontend-to-prod.yaml — since backend and frontend
# now use independent Cloud Deploy pipelines (see the comment at the top of
# clouddeploy-frontend.yaml for why), each has its own promotion flow.
#
# Usage:
#   gcloud builds submit --no-source --config=promote-backend-to-prod.yaml \
#     --substitutions=_RELEASE=rel-<short-sha>,_REGION=REGION,_REPO=bvo-images,_DELIVERY_PIPELINE=bvo-backend-pipeline
#
# This does NOT bypass the approval gate: it calls `releases promote`, which
# creates a prod rollout that stays pending until someone runs
# `gcloud deploy rollouts approve` (see trigger-setup.md) or approves it in
# the console.

steps:
  # Look up the exact backend image this release deployed to staging, so
  # prod migrations run against the same code that was tested there.
  - id: resolve-release-backend-image
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud deploy releases describe "${_RELEASE}" \
          --delivery-pipeline="${_DELIVERY_PIPELINE}" \
          --region="${_REGION}" \
          --format='value(buildArtifacts[0].tag)' \
          > /workspace/backend_image.txt
        cat /workspace/backend_image.txt

  # Migrates the PROD database — separate instance from staging, separate
  # secrets, run right before the prod rollout is created.
  #
  # Runs as a Cloud Run Job, not a raw `docker run` — see the comment in
  # cloudbuild-backend.yaml's run-staging-migrations step for why (private
  # pools can't transitively reach Cloud SQL's private IP over the `default`
  # network; the Serverless VPC Access connector can).
  - id: run-prod-migrations
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_IMAGE=$(cat /workspace/backend_image.txt)
        gcloud run jobs deploy bvo-migrate-prod \
          --image="$$BACKEND_IMAGE" \
          --region="${_REGION}" \
          --vpc-connector=bvo-vpc-connector \
          --vpc-egress=private-ranges-only \
          --set-secrets=DB_HOST=bvo-db-host-prod:latest,DB_PORT=bvo-db-port-prod:latest,DB_USERNAME=bvo-db-username-prod:latest,DB_PASSWORD=bvo-db-password-prod:latest,DB_NAME=bvo-db-name-prod:latest \
          --set-env-vars=DB_SSL=true \
          --command=npm \
          --args=run,migration:run:prod \
          --max-retries=0 \
          --task-timeout=600 \
          --quiet
        gcloud run jobs execute bvo-migrate-prod --region="${_REGION}" --wait

  - id: configure-production-export-workers
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run services describe bvo-backend-prod --region="${_REGION}" --format=json > /tmp/export-service.json
        PYTHON="$$(gcloud info --format='value(basic.python_location)')"
        "$$PYTHON" - /tmp/export-service.json /tmp/export-worker.json "$$(cat /workspace/backend_image.txt)" <<'PY'
        import json
        import sys
        
        source, output, image = sys.argv[1:]
        with open(source, encoding="utf-8-sig") as handle:
            service = json.load(handle)
        if service["metadata"]["name"] != "bvo-backend-prod":
            raise ValueError("Export worker configuration expected production")
        template = service["spec"]["template"]
        spec = template["spec"]
        annotations = {key: value for key, value in template.get("metadata", {}).get("annotations", {}).items()
                       if key in ("run.googleapis.com/vpc-access-connector", "run.googleapis.com/vpc-access-egress", "run.googleapis.com/cloudsql-instances")}
        env = [entry for entry in spec["containers"][0]["env"] if entry["name"] not in ("DB_POOL_MAX", "STUDIO_EXPORT_QUEUE_ENABLED")]
        env += [{"name": "DB_POOL_MAX", "value": "3"}, {"name": "STUDIO_EXPORT_QUEUE_ENABLED", "value": "true"}]
        job = {"apiVersion": "run.googleapis.com/v1", "kind": "Job", "metadata": {"name": "bvo-exports-prod"},
               "spec": {"template": {"metadata": {"annotations": annotations}, "spec": {"taskCount": 2, "parallelism": 2, "template": {
                   "spec": {"maxRetries": 0, "timeoutSeconds": "3600",
                       "serviceAccountName": spec["serviceAccountName"], "containers": [{"image": image,
                           "command": ["node"], "args": ["build/scripts/process-studio-exports.js"], "env": env,
                           "resources": {"limits": {"cpu": "2", "memory": "2Gi"}}}]}}}}}}
        with open(output, "w", encoding="utf-8") as handle:
            json.dump(job, handle)
        PY
        gcloud run jobs replace /tmp/export-worker.json --region="${_REGION}" --quiet
        gcloud run jobs add-iam-policy-binding bvo-exports-prod --region="${_REGION}" --member="serviceAccount:$PROJECT_NUMBER-compute@developer.gserviceaccount.com" --role=roles/run.invoker --quiet
        ACTION=create
        if gcloud scheduler jobs describe bvo-exports-prod-every-minute --location="${_REGION}" >/dev/null 2>&1; then ACTION=update; fi
        gcloud scheduler jobs "$$ACTION" http bvo-exports-prod-every-minute --location="${_REGION}" --schedule="* * * * *" --time-zone=UTC --http-method=POST --uri="https://${_REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/$PROJECT_ID/jobs/bvo-exports-prod:run" --oauth-service-account-email="$PROJECT_NUMBER-compute@developer.gserviceaccount.com" --oauth-token-scope=https://www.googleapis.com/auth/cloud-platform --quiet

  - id: promote-to-prod
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - deploy
      - releases
      - promote
      - --release=${_RELEASE}
      - --delivery-pipeline=${_DELIVERY_PIPELINE}
      - --region=${_REGION}
      - --to-target=backend-prod

substitutions:
  _REGION: us-central1
  _DELIVERY_PIPELINE: bvo-backend-pipeline

options:
  logging: CLOUD_LOGGING_ONLY
