# Cloud Run service manifest for bvo-api (backend) — staging.
# `image: backend` below is a bare artifact-key placeholder, not a real
# path — Skaffold/Cloud Deploy matches it against the `--images=backend=...`
# key at release time and swaps in the actual pushed image URI. It must
# stay exactly "backend" (no registry prefix) or the substitution silently
# doesn't happen and Cloud Run tries to pull the literal placeholder text
# as an image reference (this bit us once — see trigger-setup.md).
# Points at the STAGING Cloud SQL (PostgreSQL) instance and STAGING
# Memorystore for Valkey instance — separate from prod's, so staging never
# touches production data. Secrets are separate per environment too.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bvo-backend-staging
  labels:
    app: bvo-backend
    env: staging
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/vpc-access-connector: bvo-vpc-connector
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 80
      containers:
        - image: backend
          ports:
            - containerPort: 3000
          env:
            # PORT is deliberately not set here — Cloud Run reserves that
            # name and injects it automatically to match containerPort
            # above. Setting it manually causes deployment to fail.
            - name: NODE_ENV
              value: "staging"
            # bootstrap.ts builds its CORS allowlist from CLIENT_URLS (falls
            # back to APP_URL, comma-separated) — with neither set here,
            # `origin` was an empty array and cors() rejected every request
            # from the frontend, regardless of ENV. This is what was causing
            # the CORS/Network Error in the browser.
            - name: CLIENT_URLS
              value: "https://bvo-frontend-staging-516740748317.us-central1.run.app,https://staging-app.bionicvo.ai"
            # Seeds the storage admin setting for a new staging database.
            # An existing admin_settings.storage row takes precedence.
            - name: GCP_BUCKET
              value: "bvo-assets"
            - name: DB_SSL
              value: "true"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: bvo-db-host-staging
                  key: "latest"
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: bvo-db-port-staging
                  key: "latest"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bvo-db-username-staging
                  key: "latest"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bvo-db-password-staging
                  key: "latest"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: bvo-db-name-staging
                  key: "latest"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: bvo-redis-url-staging
                  key: "latest"
            - name: ELEVEN_LABS_API_BASE_URL
              value: "https://api.elevenlabs.io"
            # Canonical application variable used by both the ElevenLabs SDK
            # and ElevenLabsClientService. The Secret Manager resource name
            # remains GCP-specific; only its environment-variable mapping is
            # shared with the application configuration.
            - name: ELEVEN_LABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bvo-elevenlabs-key-staging
                  key: "latest"
            # Required — JwtService signs/verifies all auth tokens with
            # SERVER_CONFIG.SECRET (process.env.SECRET). Missing this makes
            # every login fail with a 400 "secretOrPrivateKey must have a
            # value" error from the jsonwebtoken library, even though the
            # request itself is otherwise fine.
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: bvo-jwt-secret-staging
                  key: "latest"
            # Keep admin-setting encryption independent from JWT signing so
            # SMTP, Stripe, and other encrypted settings survive deployments
            # and future JWT secret rotations.
            - name: SETTINGS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: bvo-settings-encryption-key-staging
                  key: "latest"
            # STRIPE_SECRET_KEY intentionally not injected here — Stripe
            # key handling is managed inside the app itself, not via this
            # Cloud Run manifest/Secret Manager.
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
