# Cloud Run service manifest for bvo-new (frontend) — staging.
# `image: frontend` below is a bare artifact-key placeholder, not a real
# path — Skaffold/Cloud Deploy matches it against the `--images=frontend=...`
# key at release time and swaps in the actual pushed image URI. It must
# stay exactly "frontend" (no registry prefix) or the substitution silently
# doesn't happen and Cloud Run tries to pull the literal placeholder text
# as an image reference (this bit us once — see trigger-setup.md).
#
# API_BASE_URL is read at RUNTIME by server.js (via a /env-config.js route
# it serves), not baked in at build time — this lets the same built image
# get promoted from staging to prod without pointing at the wrong backend.
# See src/config/api.ts for how the frontend consumes this at runtime.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bvo-frontend-staging
  labels:
    app: bvo-frontend
    env: staging
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 100
      containers:
        - image: frontend
          ports:
            - containerPort: 8080
          env:
            - name: API_BASE_URL
              value: "https://bvo-backend-staging-d5ijitzpuq-uc.a.run.app"
            # Gates analytics (GA4, Google Tag Manager and the Meta Pixel). The frontend only
            # loads tags when this reads exactly "prod" — see
            # bvo-new/src/lib/analytics/bootstrap.ts. Served to the SPA through the
            # same /env-config.js route as API_BASE_URL, so one promoted image can
            # track on prod and stay silent here without a rebuild.
            - name: APP_ENV
              value: "staging"
            - name: PUBLIC_SITE_URL
              value: "https://staging-app.bionicvo.ai"
            # GA4 measurement ID. Empty on purpose: APP_ENV gates analytics to prod
            # only, so nothing here would load anyway — but keeping the variable
            # declared and blank makes the intent explicit and means a value pasted
            # into the wrong file cannot silently start reporting non-prod traffic
            # into the production property.
            - name: GA4_MEASUREMENT_ID
              value: ""
            # Runs the full analytics pipeline — consent, page views, every event — but
            # loadScript() in bvo-new/src/lib/analytics/gtagBridge.ts refuses to inject
            # any third-party script outside live prod, so nothing reaches Google or
            # Meta. Lets staging be QA'd without a staging GA4 property and without
            # staging data landing in one. Ignored on prod.
            - name: ANALYTICS_DRY_RUN
              value: "true"
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
